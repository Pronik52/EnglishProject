<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhraseLearn — учим слова фразами</title>
<style>
  :root{
    --bg:#0f1220; --card:#191d31; --card2:#20263f; --line:#2c334f;
    --text:#eef1ff; --muted:#9aa3c7; --accent:#6c8cff; --accent2:#8b6cff;
    --good:#3ecf8e; --danger:#ff6b6b; --warn:#ffcc66;
    --radius:16px; --shadow:0 10px 40px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#232a4d 0%,transparent 60%),
               radial-gradient(1000px 500px at -10% 10%,#2a2150 0%,transparent 55%),
               var(--bg);
    color:var(--text); min-height:100vh; line-height:1.5;
  }
  .wrap{max-width:820px; margin:0 auto; padding:28px 18px 80px}
  header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:26px}
  .brand{display:flex; align-items:center; gap:12px; font-weight:800; font-size:22px; letter-spacing:.3px}
  .logo{width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow)}
  .muted{color:var(--muted)}
  .head-right{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end}
  .pill{background:var(--card2); border:1px solid var(--line); color:var(--text); padding:8px 14px; border-radius:20px; font-weight:700; font-size:13px}
  .pill:hover{border-color:var(--accent)}
  .pill.premium{background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff}
  .modal-bg{position:fixed; inset:0; background:rgba(6,8,18,.7); display:none; align-items:center; justify-content:center; padding:20px; z-index:50}
  .modal-bg.show{display:flex}
  .modal{background:var(--card); border:1px solid var(--line); border-radius:18px; max-width:440px; width:100%; padding:26px; box-shadow:var(--shadow)}
  .modal h2{margin:0 0 4px; font-size:22px}
  .modal .price{font-size:14px; color:var(--muted); margin-bottom:18px}
  .modal ul{list-style:none; padding:0; margin:0 0 22px}
  .modal li{padding:9px 0; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:baseline; font-size:15px}
  .modal li .soon{margin-left:auto; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:2px 8px; white-space:nowrap}
  .modal .note{font-size:12px; color:var(--muted); margin-top:14px; text-align:center}
  /* Карточки тарифных планов */
  .plans{display:grid; gap:10px; margin:0 0 18px}
  .plan{position:relative; display:flex; align-items:center; gap:12px; text-align:left; width:100%;
    background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; color:var(--text)}
  .plan:hover{border-color:var(--accent)}
  .plan.best{border-color:var(--accent)}
  .plan .p-term{font-weight:700; font-size:16px}
  .plan .p-per{font-size:12px; color:var(--muted)}
  .plan .p-price{margin-left:auto; text-align:right; font-weight:800; font-size:18px; white-space:nowrap}
  .plan .p-old{display:block; font-size:12px; color:var(--muted); text-decoration:line-through; font-weight:500}
  .plan .p-badge{position:absolute; top:-9px; right:14px; font-size:11px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:20px; padding:2px 9px}
  /* Форма карты */
  .cardform{display:grid; gap:12px; margin:4px 0 18px}
  .cardform label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
  .cardform input{width:100%; background:var(--card2); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:10px; font:inherit; font-size:15px; outline:none; letter-spacing:.4px}
  .cardform input:focus{border-color:var(--accent)}
  .cardform .row{display:flex; gap:12px}
  .cardform .row>div{flex:1}
  .card-err{color:var(--danger); font-size:13px; min-height:18px; margin:-6px 0 6px}
  .modal .back{background:none; border:none; color:var(--muted); cursor:pointer; font:inherit; font-size:13px; padding:0; margin-bottom:12px}
  .modal .back:hover{color:var(--text)}
  .levelbox{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
  .levelbox select{background:var(--card2); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:10px; font:inherit; font-size:14px; outline:none; cursor:pointer}
  .levelbox select:focus{border-color:var(--accent)}
  button{font:inherit; cursor:pointer; border:none; border-radius:11px; transition:.15s}
  button:active{transform:translateY(1px)}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; padding:11px 18px; font-weight:700}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text); font-weight:600}
  .btn.ghost:hover{background:var(--card2)}
  .btn.sm{padding:7px 12px; font-size:13px; border-radius:9px}
  input{
    width:100%; background:var(--card2); border:1px solid var(--line); color:var(--text);
    padding:12px 14px; border-radius:11px; font:inherit; outline:none
  }
  input:focus{border-color:var(--accent)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow)}
  .hidden{display:none!important}

  /* Auth */
  .auth{max-width:420px; margin:8vh auto 0}
  .auth h1{margin:0 0 4px; font-size:26px}
  .tabs{display:flex; gap:8px; margin:18px 0}
  .tab{flex:1; text-align:center; padding:10px; border-radius:10px; background:var(--card2); border:1px solid var(--line); color:var(--muted); font-weight:600}
  .tab.active{color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px}
  .msg{margin-top:12px; font-size:14px; min-height:18px}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--good)}
  .hint{font-size:12px; color:var(--muted); margin-top:6px}

  /* Stats */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:18px 0}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center}
  .stat b{display:block; font-size:26px}
  .stat span{font-size:13px; color:var(--muted)}

  /* Add form */
  .addgrid{display:grid; grid-template-columns:1fr 1fr auto; gap:10px}
  .preview{margin-top:12px; padding:12px 14px; background:var(--card2); border:1px dashed var(--line); border-radius:11px; font-size:14px}
  .preview em{color:var(--accent); font-style:normal; font-weight:600}

  /* Word list */
  .list{margin-top:22px; display:flex; flex-direction:column; gap:12px}
  .word{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px}
  .word.learned{border-color:var(--good); background:linear-gradient(180deg,rgba(62,207,142,.08),transparent)}
  .word .head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .word .en{font-size:19px; font-weight:800}
  .word .ru{color:var(--muted)}
  .word .badge{margin-left:auto; font-size:12px; padding:3px 9px; border-radius:20px; background:var(--card2); color:var(--muted)}
  .word.learned .badge{background:rgba(62,207,142,.15); color:var(--good)}
  .phrase{margin:10px 0 4px; font-size:15px; padding:10px 12px; background:var(--card2); border-radius:10px; border-left:3px solid var(--accent)}
  .word .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
  .progress{height:5px; background:var(--card2); border-radius:5px; overflow:hidden; margin-top:10px}
  .progress i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .empty{text-align:center; color:var(--muted); padding:40px 0}
  /* Study (режим учёбы фразами) */
  .studybar{display:flex; align-items:center; gap:14px; margin-bottom:18px}
  .studybar .count{font-weight:700; white-space:nowrap}
  .studybar .progress{flex:1; margin-top:0}
  .study-card{min-height:320px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:18px; padding:38px 26px}
  .study-card .hint{font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:1px}
  .study-card .big-phrase{font-size:26px; font-weight:700; line-height:1.4; max-width:560px}
  .study-card .big-phrase .blank{color:var(--accent); border-bottom:2px dashed var(--accent); padding:0 6px}
  .study-card .big-phrase em{color:var(--accent); font-style:normal}
  .study-card .reveal-word{font-size:22px; font-weight:800; color:var(--accent)}
  .study-type{display:flex; gap:12px; width:100%; max-width:520px; margin-top:6px}
  .study-type input{flex:1; width:auto; min-width:0; text-align:center; font-size:18px; font-weight:700}
  .study-type .btn{flex-shrink:0}
  .type-answer{font-size:17px} .type-answer b{color:var(--accent)}
  .type-answer.ok b{color:var(--good)} .type-answer.no b{color:var(--danger)}
  .phrase-ru{font-size:16px; color:var(--text); max-width:560px}
  .phrase-ru b{color:var(--muted); font-weight:600}
  .study-options{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:520px; margin-top:6px}
  .opt{padding:16px; font-size:18px; font-weight:700; background:var(--card2); border:1px solid var(--line); color:var(--text)}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:disabled{cursor:default}
  .opt.correct{background:rgba(62,207,142,.18); border-color:var(--good); color:var(--good)}
  .opt.wrong{background:rgba(255,107,107,.15); border-color:var(--danger); color:var(--danger)}
  .study-feedback{font-size:16px; font-weight:700; margin-top:4px}
  .study-feedback.ok{color:var(--good)} .study-feedback.no{color:var(--danger)}
  .study-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px}
  @media(max-width:560px){ .study-options{grid-template-columns:1fr} }
  .study-done{text-align:center; padding:50px 20px}
  .study-done .big{font-size:48px; margin-bottom:10px}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--card2); border:1px solid var(--line); padding:12px 20px; border-radius:12px;
    box-shadow:var(--shadow); opacity:0; transition:.25s; pointer-events:none}
  .toast.show{opacity:1}
  /* Кнопка-динамик озвучки + активное (проигрывается) состояние */
  .speak-btn{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; padding:0;
    background:var(--card2); border:1px solid var(--line); border-radius:8px; cursor:pointer; font-size:13px;
    line-height:1; vertical-align:middle; color:var(--text)}
  .speak-btn:hover{border-color:var(--accent)}
  .speak-btn.playing{border-color:var(--accent); color:var(--accent); animation:speakPulse .7s ease-in-out infinite}
  @keyframes speakPulse{0%,100%{transform:scale(1); opacity:1} 50%{transform:scale(1.18); opacity:.6}}
  .speak-toggle{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer; user-select:none; white-space:nowrap; flex-shrink:0}
  /* Сброс глобального input{width:100%;padding} для чекбокса — иначе он растягивается на всю ширину */
  .speak-toggle input{width:auto; margin:0; padding:0; border-radius:0; accent-color:var(--accent)}
  @media(max-width:560px){ .addgrid{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">📚</div> PhraseLearn</div>
    <div class="head-right">
      <button id="planPill" class="pill hidden">Free</button>
      <label id="levelBox" class="levelbox hidden">Уровень
        <select id="levelSel">
          <option value="A1">A1 · начинающий</option>
          <option value="A2">A2 · элементарный</option>
          <option value="B1">B1 · средний</option>
          <option value="B2">B2 · выше среднего</option>
          <option value="C1">C1 · продвинутый</option>
        </select>
      </label>
      <label id="speakBox" class="speak-toggle hidden" title="Автоозвучка слова при показе ответа в тренировке">
        <input type="checkbox" id="autoSpeak"> 🔊 Авто
      </label>
      <button id="logoutBtn" class="btn ghost sm hidden">Выйти</button>
    </div>
  </header>

  <!-- ЭКРАН АВТОРИЗАЦИИ -->
  <section id="authView" class="auth">
    <div class="card">
      <h1>Учим слова фразами</h1>
      <p class="muted">Добавляйте английские слова — к каждому появится короткая фраза, чтобы слово запомнилось в контексте.</p>
      <div class="tabs">
        <div class="tab active" data-mode="login">Вход</div>
        <div class="tab" data-mode="register">Регистрация</div>
      </div>
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="username">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
        <div class="hint" id="pwHint">Для регистрации: минимум 8 символов, заглавная буква и цифра.</div>
      </div>
      <button id="authBtn" class="btn" style="width:100%">Войти</button>
      <div class="msg" id="authMsg"></div>
    </div>
  </section>

  <!-- ОСНОВНОЙ ЭКРАН -->
  <section id="appView" class="hidden">
    <div class="stats">
      <div class="stat"><b id="stTotal">0</b><span>всего слов</span></div>
      <div class="stat"><b id="stLearned" style="color:var(--good)">0</b><span>выучено</span></div>
      <div class="stat"><b id="stLeft" style="color:var(--warn)">0</b><span>осталось</span></div>
      <div class="stat"><b id="stDue" style="color:var(--accent)">0</b><span>к повтору</span></div>
    </div>

    <div class="card">
      <div class="addgrid">
        <input id="wText" placeholder="Слово (english)">
        <input id="wTrans" placeholder="Перевод (русский)">
        <button id="addBtn" class="btn">Добавить</button>
      </div>
      <div id="previewBox" class="preview hidden"></div>
      <div class="msg err" id="addMsg"></div>
    </div>

    <button id="studyBtn" class="btn" style="width:100%;margin-top:14px">▶ Учить фразы подряд</button>

    <div class="list" id="list"></div>
  </section>

  <!-- ЭКРАН УЧЁБЫ ФРАЗАМИ -->
  <section id="studyView" class="hidden">
    <div class="studybar">
      <span class="count" id="studyCount">0 / 0</span>
      <div class="progress"><i id="studyProgress" style="width:0%"></i></div>
      <label class="speak-toggle" id="typeModeBox" title="Вводить слово вручную вместо выбора из вариантов">
        <input type="checkbox" id="typeMode"> ✍️ Ввод
      </label>
      <button id="studyExit" class="btn ghost sm">Выйти</button>
    </div>
    <div class="card study-card" id="studyBody"></div>
  </section>
</div>

<!-- Модальное окно Premium -->
<div class="modal-bg" id="premiumModal">
  <div class="modal" id="premiumBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "/api/v1";
let token = localStorage.getItem("token") || null;
let authMode = "login";

const $ = s => document.querySelector(s);
const toast = (t) => { const el=$("#toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1800); };

async function api(path, {method="GET", body=null, form=false, auth=false}={}){
  const headers = {};
  if(token) headers["Authorization"] = "Bearer "+token;
  let payload = body;
  if(form){ headers["Content-Type"]="application/x-www-form-urlencoded"; payload=new URLSearchParams(body).toString(); }
  else if(body){ headers["Content-Type"]="application/json"; payload=JSON.stringify(body); }
  const res = await fetch(API+path, {method, headers, body:payload});
  const data = res.status===204 ? null : await res.json().catch(()=>null);
  if(!res.ok){
    // 401 на защищённом запросе = сессия истекла → выходим.
    // На запросах входа/регистрации (auth) 401 = неверные данные, показываем причину.
    if(res.status===401 && !auth){ logout(); const e=new Error("Нужно войти заново."); e.status=401; throw e; }
    const m = data?.error?.message || data?.detail || "Что-то пошло не так, попробуйте ещё раз.";
    const e = new Error(typeof m==="string"?m:JSON.stringify(m));
    e.status = res.status;
    throw e;
  }
  return data;
}

/* ---------- Авторизация ---------- */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  authMode=t.dataset.mode;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));
  $("#authBtn").textContent = authMode==="login" ? "Войти" : "Зарегистрироваться";
  $("#pwHint").style.display = authMode==="register" ? "block" : "none";
  $("#password").autocomplete = authMode==="login" ? "current-password":"new-password";
  $("#authMsg").textContent="";
});
$("#pwHint").style.display="none";

$("#authBtn").onclick = async ()=>{
  const email=$("#email").value.trim(), password=$("#password").value;
  const msg=$("#authMsg"); msg.className="msg"; msg.textContent="";
  if(!email||!password){ msg.className="msg err"; msg.textContent="Заполните email и пароль."; return; }
  try{
    if(authMode==="register"){
      await api("/auth/register",{method:"POST",body:{email,password},auth:true});
      msg.className="msg ok"; msg.textContent="Готово! Входим…";
    }
    const tok = await api("/auth/login",{method:"POST",form:true,body:{username:email,password},auth:true});
    token = tok.access_token; localStorage.setItem("token",token);
    enterApp();
  }catch(e){ msg.className="msg err"; msg.textContent=e.message; }
};

function logout(){
  token=null; localStorage.removeItem("token");
  $("#appView").classList.add("hidden"); $("#authView").classList.remove("hidden");
  $("#logoutBtn").classList.add("hidden");
  $("#levelBox").classList.add("hidden");
  $("#speakBox").classList.add("hidden");
  $("#planPill").classList.add("hidden");
}
$("#logoutBtn").onclick=logout;

/* Смена уровня: новые фразы (при добавлении/регенерации/предпросмотре) станут
   проще или сложнее. Уже сохранённые фразы не меняются. */
$("#levelSel").onchange = async ()=>{
  try{
    await api("/auth/level",{method:"PATCH",body:{level:$("#levelSel").value}});
    toast("Уровень: "+$("#levelSel").value);
    if($("#wText").value.trim()) schedulePreview();
  }catch(e){ toast(e.message); }
};

/* ---------- Основной экран ---------- */
async function enterApp(){
  $("#authView").classList.add("hidden");
  $("#appView").classList.remove("hidden");
  $("#logoutBtn").classList.remove("hidden");
  try{ const me=await api("/auth/me"); $("#levelSel").value=me.level; }catch(e){}
  $("#levelBox").classList.remove("hidden");
  if(speech.supported) $("#speakBox").classList.remove("hidden"); // тумблер автоозвучки — только если API есть
  await refresh();
}

async function refresh(){
  const [stats, words, bill] = await Promise.all([
    api("/words/stats"),
    api("/words?limit=1000"),
    api("/billing/status").catch(()=>null)
  ]);
  $("#stTotal").textContent=stats.total;
  $("#stLearned").textContent=stats.learned;
  $("#stLeft").textContent=stats.remaining;
  $("#stDue").textContent=stats.due ?? 0;
  // billing нужен до renderList: по нему считаем остаток генераций на кнопке.
  if(bill){ billing=bill; renderPill(); }
  renderList(words.items);
}

/* ---------- Тариф / монетизация ---------- */
let billing=null;

// Рисует пилюлю тарифа по текущему billing (без сетевого запроса).
function renderPill(){
  if(!billing) return;
  const pill=$("#planPill");
  pill.classList.remove("hidden");
  if(billing.is_premium){
    pill.textContent="⭐ Premium";
    pill.classList.add("premium");
  }else{
    pill.textContent=`Free · ${billing.used_today}/${billing.daily_limit} сегодня`;
    pill.classList.remove("premium");
  }
}

// Бесплатных генераций фразы на слово (совпадает с FREE_REGEN_LIMIT на бэке).
const REGEN_LIMIT=5;

// SRS: максимальный уровень (совпадает с SRS_MAX_LEVEL на бэке).
const SRS_MAX_LEVEL=5;

// Русское склонение числительного.
function plural(n,one,few,many){
  const m10=n%10, m100=n%100;
  if(m10===1 && m100!==11) return one;
  if(m10>=2 && m10<=4 && (m100<10||m100>=20)) return few;
  return many;
}
// Метка следующего повтора по due_at (строка UTC с бэка).
function dueLabel(dueAt){
  if(!dueAt) return "к повтору";
  const t = Date.parse(/[zZ+]/.test(dueAt) ? dueAt : dueAt+"Z"); // трактуем как UTC
  const ms = t - Date.now();
  if(ms<=0) return "к повтору";
  const days=Math.ceil(ms/86400000);
  if(days>=1) return `через ${days} ${plural(days,'день','дня','дней')}`;
  const hours=Math.max(1,Math.ceil(ms/3600000));
  return `через ${hours} ${plural(hours,'час','часа','часов')}`;
}
// Время «просроченности» для сортировки: чем меньше due_at, тем раньше повтор.
function dueTime(dueAt){ return dueAt ? Date.parse(/[zZ+]/.test(dueAt)?dueAt:dueAt+"Z") : 0; }

/* ---------- Озвучка (Web Speech API, без внешних зависимостей и ключей) ---------- */
const speech = {
  supported: typeof window!=="undefined" && "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
  voice: null,
  // getVoices() при первом вызове часто пуст — тогда голоса подтянутся позже по voiceschanged.
  loadVoices(){
    if(!this.supported) return;
    const voices = speechSynthesis.getVoices() || [];
    this.voice = voices.find(v=>v.lang==="en-US")
      || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("en"))
      || this.voice;  // не нашли — оставим прежний/дефолтный, lang всё равно зададим
  },
  speak(text, btn=null, rate=0.9){
    if(!this.supported || !text) return;
    try{
      speechSynthesis.cancel(); // гасим предыдущую озвучку — не накладываем и не копим при быстрых кликах
      const u = new SpeechSynthesisUtterance(text);
      u.lang="en-US";
      if(this.voice) u.voice=this.voice;
      u.rate=rate;
      document.querySelectorAll(".speak-btn.playing").forEach(b=>b.classList.remove("playing"));
      if(btn) btn.classList.add("playing");
      u.onend = u.onerror = ()=>{ if(btn) btn.classList.remove("playing"); };
      speechSynthesis.speak(u);
    }catch(e){ /* озвучка необязательна — молча игнорируем сбой */ }
  }
};
if(speech.supported){
  speech.loadVoices();
  speechSynthesis.onvoiceschanged = ()=>speech.loadVoices();
}
// HTML кнопки-динамика. Пусто, если API не поддерживается — тогда кнопку просто не рисуем.
function spk(text){
  if(!speech.supported || !text) return "";
  return `<button type="button" class="speak-btn" data-speak="${esc(text)}" title="Озвучить" aria-label="Озвучить">🔊</button>`;
}
// Единый делегат: клик по любой кнопке-динамику озвучивает её текст (stopPropagation — чтобы не задеть клики карточек).
document.addEventListener("click",(e)=>{
  const b=e.target.closest(".speak-btn");
  if(b){ e.stopPropagation(); speech.speak(b.dataset.speak, b); }
});

/* ---------- Режим учёбы: викторина с выбором из 4 слов ---------- */
let study = {cards:[], i:0, options:[], answered:false, chosen:null, correct:false};

// Запасные слова-отвлекатели, если в словаре пока мало слов.
const FALLBACK_WORDS=["time","people","water","music","light","money","house","garden",
  "market","letter","summer","travel","coffee","window","picture","school","animal","river"];

function shuffle(a){ for(let k=a.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; } return a; }

// Заменяет изучаемое слово во фразе на пропуск (••• с подчёркиванием).
function blankPhrase(phrase, word){
  const p=esc(phrase);
  if(!word) return p;
  const re=new RegExp("("+word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  return p.replace(re,'<span class="blank">•••</span>');
}

// Собирает 4 варианта: правильное слово + 3 отвлекателя из других слов словаря.
function buildOptions(cards, i){
  const correct=cards[i].text;
  const seen=new Set([correct.toLowerCase()]);
  const pool=[];
  for(const c of cards){ const t=c.text; if(!seen.has(t.toLowerCase())){ pool.push(t); seen.add(t.toLowerCase()); } }
  shuffle(pool);
  const extra=shuffle(FALLBACK_WORDS.filter(f=>!seen.has(f)));
  const distractors=[...pool, ...extra].slice(0,3);
  return shuffle([correct, ...distractors]);
}

async function startStudy(){
  let words;
  try{ words=(await api("/words?limit=1000")).items; }
  catch(e){ toast(e.message); return; }
  if(!words.length){ toast("Сначала добавьте слова ☝️"); return; }
  // SRS-порядок: выученные в конец, остальные — по «просроченности» (раньше due_at → раньше).
  words.sort((a,b)=>{
    if(a.is_learned!==b.is_learned) return a.is_learned?1:-1;
    return dueTime(a.due_at) - dueTime(b.due_at);
  });
  study={cards:words, i:0, options:[], answered:false, chosen:null, correct:false};
  $("#appView").classList.add("hidden");
  $("#studyView").classList.remove("hidden");
  goToCard(0);
}

function exitStudy(){
  $("#studyView").classList.add("hidden");
  $("#appView").classList.remove("hidden");
  refresh();
}

function goToCard(index){
  study.i=index; study.answered=false; study.chosen=null; study.correct=false;
  if(index<study.cards.length) study.options=buildOptions(study.cards, index);
  renderStudy();
}

function renderStudy(){
  const {cards,i,answered,chosen,correct,options}=study;
  const body=$("#studyBody");
  if(i>=cards.length){
    $("#studyCount").textContent=cards.length+" / "+cards.length;
    $("#studyProgress").style.width="100%";
    body.innerHTML=`<div class="study-done"><div class="big">🎉</div>
      <h2>Готово!</h2><p class="muted">Вы прошли все фразы.</p>
      <button class="btn" onclick="exitStudy()">Вернуться к словам</button></div>`;
    return;
  }
  $("#studyCount").textContent=(i+1)+" / "+cards.length;
  $("#studyProgress").style.width=(i/cards.length*100)+"%";
  const w=cards[i];
  const typeMode = $("#typeMode") && $("#typeMode").checked;
  const phraseHtml=answered?highlight(w.phrase||'—',w.text):blankPhrase(w.phrase||'—',w.text);

  // Область ответа: поле ввода (режим «Ввод») либо варианты для выбора.
  let answerArea;
  if(typeMode){
    answerArea = answered
      ? `<div class="type-answer ${correct?'ok':'no'}">Ваш ответ: <b>${esc(chosen||'—')}</b>${correct?'':` · верно: <b>${esc(w.text)}</b>`}</div>`
      : `<div class="study-type">
           <input id="typeAns" type="text" placeholder="введите пропущенное слово" autocomplete="off" autocapitalize="off" spellcheck="false">
           <button class="btn" data-s="check">Проверить</button>
         </div>`;
  }else{
    const optsHtml=options.map(o=>{
      let cls="opt";
      if(answered){
        if(o.toLowerCase()===w.text.toLowerCase()) cls+=" correct";
        else if(o===chosen) cls+=" wrong";
      }
      return `<button class="${cls}" data-opt="${esc(o)}" ${answered?'disabled':''}>${esc(o)}</button>`;
    }).join("");
    answerArea = `<div class="study-options">${optsHtml}</div>`;
  }

  // До ответа — подсказка «перевод слова»; после ответа — перевод ВСЕЙ фразы.
  // phrase_ru: непусто — показываем; "" — недоступен, откатываемся на перевод слова; null — ещё грузится.
  let meaning;
  if(!answered){
    meaning = `<div class="muted">Перевод слова: ${esc(w.translation)}</div>`;
  }else{
    const ruText = w.phrase_ru ? esc(w.phrase_ru) : (w.phrase_ru==="" ? esc(w.translation) : "…");
    meaning = `<div class="phrase-ru"><b>Перевод фразы:</b> ${ruText}</div>`;
  }

  const feedback=answered
    ? `<div class="study-feedback ${correct?'ok':'no'}">${correct?'Верно! +1 запоминание':'Неверно, −1 запоминание'}</div>`
    : '';
  const actions=answered
    ? `<button class="btn" data-s="next">Дальше →</button>`
    : `<button class="btn ghost" data-s="skip">Пропустить →</button>`;
  body.innerHTML=`
    <div class="hint">${answered?'слово во фразе':'какое слово пропущено?'}</div>
    <div class="big-phrase">${phraseHtml} ${answered && w.phrase?spk(w.phrase):''}</div>
    ${meaning}
    ${answerArea}
    ${feedback}
    <div class="study-actions">${actions}</div>`;

  if(typeMode && !answered){ const inp=$("#typeAns"); if(inp) inp.focus(); }
  // Перевод фразы ещё не загружен (старые слова) — тянем лениво и перерисовываем.
  if(answered && w.phrase_ru==null) loadPhraseRu(w);
}

// Ленивая подгрузка русского перевода фразы для текущей карточки.
async function loadPhraseRu(w){
  try{
    const r=await api(`/words/${w.id}/phrase-translation`);
    w.phrase_ru = r.phrase_ru || ""; // "" — перевод недоступен, но повторно не тянем
    if(study.cards[study.i]===w && study.answered) renderStudy();
  }catch(e){ w.phrase_ru = ""; }
}

// Общая обработка ответа (и для выбора, и для ввода).
async function submitAnswer(chosenText){
  if(study.answered) return;
  const w=study.cards[study.i];
  const correct = chosenText.toLowerCase()===w.text.toLowerCase();
  study.answered=true; study.chosen=chosenText; study.correct=correct;
  renderStudy(); // сразу показываем результат
  if(speech.supported && $("#autoSpeak").checked) speech.speak(w.phrase); // автоозвучка на показе ответа
  try{
    const updated=await api(`/words/${w.id}/answer`,{method:"PATCH",body:{correct}});
    // сервер вернёт слово с сохранённым phrase_ru — подхватываем, не теряя загруженный перевод
    if(updated.phrase_ru==null) updated.phrase_ru=w.phrase_ru;
    study.cards[study.i]=updated;
    renderStudy();
  }catch(err){ toast(err.message); }
}

$("#studyBody").onclick = (e)=>{
  const opt=e.target.closest("button.opt");
  if(opt){ if(!study.answered) submitAnswer(opt.dataset.opt); return; } // выбор варианта
  const check=e.target.closest('button[data-s="check"]');
  if(check){ const v=($("#typeAns").value||"").trim(); if(v) submitAnswer(v); return; } // проверка ввода
  const act=e.target.closest("button[data-s]");
  if(act && (act.dataset.s==="next" || act.dataset.s==="skip")) goToCard(study.i+1);
};
// Enter в поле ввода = проверить.
$("#studyBody").addEventListener("keydown",(e)=>{
  if(e.key==="Enter" && e.target.id==="typeAns"){ e.preventDefault(); const v=e.target.value.trim(); if(v) submitAnswer(v); }
});
$("#studyBtn").onclick=startStudy;
$("#studyExit").onclick=exitStudy;

/* Автовход, если есть токен */
if(token){ enterApp().catch(logout); }
</script>
</body>
</html>
